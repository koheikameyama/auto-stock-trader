name: "[Reusable] Backfill Corporate Events"

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      DATABASE_URL:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
      YFINANCE_PROXY:
        required: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  YAHOO_THROTTLE_CONCURRENCY: "3"
  YFINANCE_PROXY: ${{ secrets.YFINANCE_PROXY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Start yfinance sidecar
        uses: ./.github/actions/start-yfinance
      # 全銘柄(3716件)の決算・配当情報をyfinanceから逐次取得するため実処理は60-90分かかる。
      # timeout_minutes はこの実処理時間を超える値にすること（2026-09-01、60分設定で
      # 3回とも完走前にタイムアウトし、DB接続断より悪い「常に失敗」を引き起こした）。
      - name: Run backfill:corporate-events (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 2
          retry_wait_seconds: 60
          command: npm run backfill:corporate-events

  notify-success:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on success
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Backfill Corporate Events 完了"
          SLACK_MESSAGE: "コーポレートイベント（決算日・配当日）の更新が完了しました"
          SLACK_COLOR: good
          SLACK_FOOTER: "Auto Stock Trader"

  notify-failure:
    needs: run
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Backfill Corporate Events 失敗"
          SLACK_MESSAGE: |
            @here
            コーポレートイベント更新が失敗しました。
          SLACK_COLOR: danger
          SLACK_FOOTER: "Auto Stock Trader"
