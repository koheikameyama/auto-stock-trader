name: "[Scheduled] Monthly Strategy Health Check"

on:
  schedule:
    # 毎週土曜 11:00 JST = 02:00 UTC に起動し、check-first-saturday が「第1土曜」に絞る。
    # ⚠️ "0 2 1-7 * 6" と書いてはいけない: POSIX cron は day-of-month と day-of-week の
    # 両方を指定すると OR になり「毎月1-7日の毎日 + 毎週土曜」= 月11-12回実行される
    # (KOH-605、2026-05〜08 に実際に発生)。
    - cron: "0 2 * * 6"
  workflow_dispatch:

concurrency:
  group: monthly-strategy-health
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # 第1土曜ゲート: schedule 起動は JST の日付が 1-7 日の時だけ通す (= 第1土曜)。
  # workflow_dispatch (手動実行) は日付に関わらず通す。
  check-first-saturday:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        run: |
          DAY=$(TZ=Asia/Tokyo date +%-d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$DAY" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "JST ${DAY}日は第1土曜ではないためスキップ"
          fi

  walk-forward:
    needs: check-first-saturday
    if: needs.check-first-saturday.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Run walk-forward analysis (active strategies gapup / psc)
        run: python scripts/run_monthly_walk_forward.py
      - name: Upload WF results for baseline captain review
        if: always()  # 一部失敗でも書き出せた分は統合レビューに渡す
        uses: actions/upload-artifact@v4
        with:
          name: wf-results
          path: wf-results.json
          if-no-files-found: warn
          retention-days: 7

  # 旧 combined-compare (strategy-mix 比較) は KOH-516 で撤去。
  # 大型株戦略の復活比較は KOH-511/512 で決着済み (substitute)。再評価は ¥10M+ 移行時に手動。
  baseline-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check-first-saturday, walk-forward]
    # WFが失敗しても baseline ヘルスは実行する (独立した判断材料)。第1土曜ゲートだけは通す
    if: always() && needs.check-first-saturday.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Download WF results (for unified captain review)
        continue-on-error: true  # WF失敗時は artifact 無し → baseline 単独でレビュー
        uses: actions/download-artifact@v4
        with:
          name: wf-results
      - name: Run baseline health check (GU3+PSC2, 直近24ヶ月ローリング)
        run: python scripts/run_monthly_baseline_health.py

  us-etf-health:
    needs: check-first-saturday
    if: needs.check-first-saturday.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # WF/combined-compare とは独立 (実トレード集計のみで BT 不要)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: ETF strategy health (劣化検知)
        run: npm run us-etf-health

  # live↔BT パリティ監査 (KOH-606): 直近の本番約定を BT precompute と突き合わせ、
  # SMA50 事故 (本番だけフィルターが外れて4ヶ月放置) 型の系統的乖離を1ヶ月以内に検知する
  parity-audit:
    needs: check-first-saturday
    if: needs.check-first-saturday.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # WF / baseline とは独立 (本番DBの約定と precompute のみ)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: live↔BT parity audit (系統的乖離の検知)
        run: python scripts/run_monthly_parity_audit.py

  notify-failure:
    needs: [check-first-saturday, walk-forward, baseline-health, us-etf-health, parity-audit]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "❌ Monthly Strategy Health Check 失敗"
          SLACK_MESSAGE: |
            戦略ヘルスチェック (WF + baselineヘルス) が失敗しました。
            詳細はGitHub Actionsログを確認してください。
          SLACK_COLOR: danger
          SLACK_FOOTER: "Auto Stock Trader"
