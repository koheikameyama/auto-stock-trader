name: "[Scheduled] Backfill Fundamentals"

on:
  schedule:
    # 日曜 18:00 JST = 09:00 UTC（週1、低負荷帯）
    - cron: "0 9 * * 0"
  workflow_dispatch:

concurrency:
  group: backfill-fundamentals
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  YFINANCE_PROXY: ${{ secrets.YFINANCE_PROXY }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".tool-versions"
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - name: Start yfinance sidecar
        uses: ./.github/actions/start-yfinance
      - run: npm run backfill:fundamentals

  notify-success:
    needs: run
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on success
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Backfill Fundamentals 完了"
          SLACK_MESSAGE: "ファンダメンタルズ（PER/PBR/EPS/marketCap）のバックフィルが完了しました"
          SLACK_COLOR: good
          SLACK_FOOTER: "Auto Stock Trader"

  notify-failure:
    needs: run
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Backfill Fundamentals 失敗"
          SLACK_MESSAGE: |
            @here
            ファンダメンタルズバックフィルが失敗しました。
          SLACK_COLOR: danger
          SLACK_FOOTER: "Auto Stock Trader"
